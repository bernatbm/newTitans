
services:
  # PHP - APACHE CONTAINER
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-apache
    ports:
      - 5000:80
    volumes:
      - ./src:/var/www/html
    networks:
      - newTitans
    depends_on:
      - mysql
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    working_dir: /var/www/html

  # MYSQL CONTAINER
  mysql:
    image: mysql:8.0
    container_name: baseDatosNewTitans
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dataBaseNewTitans
      MYSQL_USER: bernat
      MYSQL_PASSWORD: newtitansdb
    networks:
      - newTitans
    volumes:
      - mysql_data:/var/lib/mysql

  # PHPMYADMIN CONTAINER
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - 8024:80
    environment:
      PMA_HOST: baseDatosNewTitans
    networks:
      - newTitans

  # WORDPRESS CONTAINER
  wordpress:
    image: wordpress:latest # La última imagen de wordpress
    container_name: wordpress # El nombre del container
    depends_on:
      - mysql # Depende del container mysql
    ports:
      - 9090:80 # El puerto
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: bernat
      WORDPRESS_DB_PASSWORD: newtitansdb
      WORDPRESS_DB_NAME: dataBaseNewTitans
    volumes:
      - ./src/wordpress:/var/www/html # La ruta donde esta creada (he creado una carpeta en src llamada wordpress)
    networks:
      - newTitans # La network donde todo está conectado

networks:
  newTitans:

volumes:
  mysql_data:
